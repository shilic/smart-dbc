name: Release

# 博客《SDK的设计哲学》第八章 —— CD 持续交付
# 通过 release-please 实现：
#   1. 根据 Conventional Commits 自动决定版本号
#        fix: → 补丁+1  |  feat: → 次版本+1  |  feat!/BREAKING CHANGE: → 主版本+1
#   2. 自动生成 CHANGELOG.md
#   3. 合并 release PR 后自动打 tag + 创建 GitHub Release
#   4. 触发 publish job，发布到 Maven Central + GitHub Packages

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 阶段1：release-please 维护 release PR，合并后打 tag + 生成 CHANGELOG
  release-please:
    name: 生成版本号与 CHANGELOG
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: release-please
        id: release
        # 使用谷歌的 release-please-action 会自动修改版本号。完成CD的主要流程
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

  # 阶段2：release PR 合并后，自动发布到两个仓库
  publish:
    name: 发布到 Maven Central + GitHub Packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 Gradle 并缓存依赖
        uses: gradle/actions/setup-gradle@v4

      # Windows 开发环境下 gradlew 常丢失可执行位，运行前强制加上，避免 Permission denied
      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # 发布到 Maven Central（GPG 签名 + 凭证通过环境变量注入）
      # 若需发布后自动 close+release，可改用 ./gradlew publishAndReleaseToMavenCentral
      - name: 发布到 Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          # 使用 secrets.MAVEN_CENTRAL_USERNAME  获取环境变量，需要到github上进行配置，详细请看 readme.md文件
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      # 发布到 GitHub Packages。
      # build.gradle.kts 从 GITHUB_ACTOR（Actions 自动注入）/ GITHUB_TOKEN 环境变量读取凭证。
      # 任务名若与你的发布配置不一致，可用 ./gradlew tasks 确认。
      - name: 发布到 GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 该任务同样触发 signMavenPublication（signAllPublications 签所有 publication），必须带上签名环境变量
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

# =============================================================================
# 需在仓库 Settings → Secrets and variables → Actions 中配置的 secrets：
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal 的 token 用户名
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal 的 token 密码
#   GPG_PRIVATE_KEY          ASCII-armored GPG 私钥（含 -----BEGIN PGP PRIVATE KEY BLOCK-----）
#   GPG_PASSPHRASE           私钥密码
#   （GITHUB_TOKEN 无需手动配置，GitHub 自动注入）
# =============================================================================
